[workspace]
members = ["os/kernel", "os/crates/*", "os/arch"]
resolver = "2"

[workspace.dependencies]
arch = { path = "os/arch" }
serial = { path = "os/crates/serial" }
sync = { path = "os/crates/sync" }

uart_16550 = "0.3.0"
log = "0.4.22"
derive_more = { version = "2.0.1", default-features = false, features = [
  "display",
  "error",
  "from",
  "debug",
] }

[profile.dev]
debug = "full"
opt-level = 1

[profile.release]
debug = "full"
incremental = true

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
