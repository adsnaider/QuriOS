[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
test = false
bench = false

[[bin]]
name = "kmain"
test = false
bench = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log.workspace = true
serial.workspace = true
sync.workspace = true
derive_more.workspace = true
loader.workspace = true
tap.workspace = true

limine = "0.5.0"
tar-no-std = "0.3.4"
extend = "1.2.0"
heapless = "0.8.0"
qapi.workspace = true
zerocopy.workspace = true
derive-where = "1.5.0"
ghost-cell = "0.2.6"
paste = "1.0.15"

bitflags = "2.9.1"
cfg-if = "1.0.1"
sealed.workspace = true
tailcall = "1.0.1"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.2", default-features = false, features = [
  "instructions",
] }
pic8259 = "0.11.0"
