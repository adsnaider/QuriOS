[package]
name = "arch"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.9.1"
cfg-if = "1.0.1"
derive_more = { workspace = true, features = ["deref"] }
extend = "1.2.0"
loader.workspace = true
log.workspace = true
qapi.workspace = true
sync.workspace = true

[lints]
workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.2", default-features = false, features = [
  "instructions",
] }
